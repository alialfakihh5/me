<title>علي الفقيه</title>
<style>
:root {
  --ground:#eeeae3; --ink:#171513; --muted:#7d746a; --hair:rgba(23,21,19,.16);
  --card:#f6f4ef; --inv-bg:#171513; --inv-ink:#eeeae3; --inv-mut:#a79d92;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#121110; --ink:#eeeae3; --muted:#948a80; --hair:rgba(238,234,227,.17);
    --card:#1c1a18; --inv-bg:#eeeae3; --inv-ink:#171513; --inv-mut:#5f574e;
  }
}
:root[data-theme="dark"] {
  --ground:#121110; --ink:#eeeae3; --muted:#948a80; --hair:rgba(238,234,227,.17);
  --card:#1c1a18; --inv-bg:#eeeae3; --inv-ink:#171513; --inv-mut:#5f574e;
}

* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,sans-serif;
  padding:30px 20px 46px; display:flex; flex-direction:column; align-items:center;
}
.wrap { width:100%; max-width:400px; }

/* رأس الصفحة: بطاقة المحفظة نفسها، فيتعرّف عليها من مسح الرمز فوراً */
.card { border:1px solid var(--hair); border-radius:13px; overflow:hidden; background:var(--card); }
.card img { display:block; width:100%; height:auto; }

.role {
  margin:20px 0 26px; text-align:center; font-size:10.5px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.24em; padding-right:.24em;
}

/* القائمة: خطوط شعرة تفصل الصفوف، لا بطاقات ولا ظلال */
.list { border-top:1px solid var(--hair); }
.row {
  display:flex; align-items:center; gap:14px; padding:16px 2px;
  border-bottom:1px solid var(--hair); color:inherit; text-decoration:none;
}
.row:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.row svg { flex:none; width:19px; height:19px; fill:none; stroke:currentColor;
           stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.txt { flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; }
.ttl { font-size:15.5px; font-weight:500; }
.sub { font-size:13px; color:var(--muted); direction:ltr; margin-inline-start:auto;
       overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.go { flex:none; font-size:17px; color:var(--muted); }

/* الصف الوحيد المملوء — نقطة التوكيد الوحيدة في الصفحة */
.row.primary {
  background:var(--inv-bg); color:var(--inv-ink); border-bottom-color:transparent;
  border-radius:11px; padding:17px 15px; margin-bottom:1px;
}
.row.primary .sub { color:var(--inv-mut); }
.row.primary .go { color:var(--inv-mut); }

.copy {
  flex:none; width:31px; height:31px; border-radius:8px; cursor:pointer; padding:0;
  background:none; border:1px solid var(--hair); color:var(--muted);
  display:grid; place-items:center; font:inherit;
}
.copy:hover { color:var(--ink); border-color:var(--ink); }
.copy:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.copy svg { width:14px; height:14px; stroke-width:1.5; }
.copy.done { color:var(--ink); border-color:var(--ink); }

.foot {
  margin-top:26px; text-align:center; font-size:10.5px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.2em; padding-right:.2em;
}
</style>
<script>
  document.documentElement.setAttribute('dir','rtl');
  document.documentElement.setAttribute('lang','ar');
</script>
